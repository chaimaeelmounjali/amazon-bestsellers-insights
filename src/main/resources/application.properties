# Configuration Database
spring.datasource.url=jdbc:mysql://localhost:3306/amazon_bestsellers?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.amazonbestseller=DEBUG

# App Flags
app.load-csv-on-startup=true
app.clean-before-load=true
csv.file.path=uploads/amazon_bestsellers_enriched.csv

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Multipart (Upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
