spring:
  application:
    name: AmazonBestSeller

  datasource:
    url: jdbc:mysql://localhost:3306/amazon_bestsellers?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Configuration des ressources statiques
  web:
    resources:
      static-locations:
        - "file:${file.upload.dir}"
        - "classpath:/static/"
        - "classpath:/public/"
        - "classpath:/resources/"
        - "classpath:/META-INF/resources/"
      cache:
        period: 31536000
        cachecontrol:
          max-age: 31536000
          must-revalidate: true

  mvc:
    static-path-pattern: /uploads/**

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Configuration CSV
csv:
  file:
    path: data/amazon_bestsellers.csv
  encoding: UTF-8
  separator: ","
  skip-header: true

# Configuration application
app:
  load-csv-on-startup: true
  clean-before-load: true
  image-download:
    enabled: true
    timeout: 5000
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    max-retries: 3
  images:
    base-url: http://localhost:8080/api/uploads/
    default-placeholder: /images/placeholder.jpg

# Configuration des fichiers
file:
  upload:
    dir: C:/uploads/
    images: C:/uploads/images/
    max-size: 10MB

# Configuration CORS
cors:
  allowed-origins: http://localhost:3000,http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    com.example.amazonbestseller: DEBUG
    org.springframework.web: INFO
    org.springframework.web.servlet.resource: DEBUG
